name: Build Redmi AX6000 (MTK U-Boot)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游：留空=跟 25.12 最新 HEAD（正式发布）；pinned=用 config/upstream.lock；40 位 SHA=测试构建（不发 Release）'
        required: false
        default: ''
      hardening:
        description: '编译硬化：on（默认）/ off（临时关 format-security+RELRO+ccache，仅用于定位失败）'
        required: false
        default: 'on'
      jobs:
        description: '并行编译数（留空自动，范围 1-64）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

# 最小权限：构建只读，发布 job 单独申请 contents: write
permissions:
  contents: read

concurrency:
  group: build-ax6000-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: chasey-dev/immortalwrt-mt798x-rebase
  # 默认跟 25.12 分支最新 HEAD（激进模式）。需要复现或回退时用 upstream_ref：
  #   留空   -> 解析 25.12 最新 HEAD，正式构建并发 Release
  #   pinned -> 用 config/upstream.lock 里已验证出过包的 SHA（run #5 / 714b898）
  #   40 位  -> 用指定 SHA 做测试构建，只产 artifact，不发 Release
  UPSTREAM_BRANCH: '25.12'
  UPSTREAM_LOCK_FILE: config/upstream.lock
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      release: ${{ steps.src.outputs.release }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: 检出构建配置
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 秒级失败：固件脚本语法 / 清单格式 / feeds.lock，不必等 defconfig 跑完。
      - name: 静态校验仓库文件
        run: sh scripts/validate-config.sh

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk g++ \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools bc patch swig ccache \
            rsync unzip zlib1g-dev file wget curl

      - name: 拉取上游源码
        id: src
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          REF="${UPSTREAM_REF:-}"
          case "$REF" in
            '')
              TARGET=$(git ls-remote "https://github.com/${SOURCE_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | awk '{print $1}')
              printf '%s' "$TARGET" | grep -Eq '^[0-9a-f]{40}$' \
                || { echo "无法解析上游 ${UPSTREAM_BRANCH} HEAD" >&2; exit 1; }
              MODE=latest
              RELEASE=true
              echo "正式构建: 上游 ${UPSTREAM_BRANCH} 最新 ${TARGET}"
              ;;
            pinned)
              [ -f "$UPSTREAM_LOCK_FILE" ] || { echo "缺少 $UPSTREAM_LOCK_FILE" >&2; exit 1; }
              TARGET=$(grep -Ev '^[[:space:]]*(#|$)' "$UPSTREAM_LOCK_FILE" | head -1 | awk '{print $1}')
              printf '%s' "$TARGET" | grep -Eq '^[0-9a-f]{40}$' \
                || { echo "$UPSTREAM_LOCK_FILE 里没有合法 40 位 SHA" >&2; exit 1; }
              MODE=pinned
              RELEASE=true
              echo "正式构建: 钉死上游 ${TARGET}（$UPSTREAM_LOCK_FILE）"
              ;;
            *)
              printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$' \
                || { echo "upstream_ref 只能是 pinned、40 位小写 SHA，或留空" >&2; exit 1; }
              TARGET="$REF"
              MODE=test
              RELEASE=false
              echo "测试构建: ${TARGET}（不会发布 Release）"
              ;;
          esac
          git init openwrt
          cd openwrt
          git remote add origin "https://github.com/${SOURCE_REPO}.git"
          git fetch --depth 1 origin "$TARGET"
          git checkout --detach FETCH_HEAD
          SHA=$(git rev-parse HEAD)
          [ "$SHA" = "$TARGET" ] || { echo "拉取到的 $SHA 与目标 $TARGET 不一致，终止" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "upstream_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_MODE=$MODE" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "上游: ${SOURCE_REPO}@${SHA} (${MODE})"
          git log -1 --format='%ci  %s'

      - name: 计算版本号
        id: meta
        env:
          TAG_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ steps.src.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${TAG_REF}" != "${TAG_REF#refs/tags/v}" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(date -u +%Y.%m.%d)-$(echo "$SHA" | cut -c1-7)-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本: $TAG"

      - name: 缓存下载源码和 ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: dl-${{ steps.src.outputs.sha }}-${{ hashFiles('config/feeds.lock', 'config/ax6000.config') }}
          restore-keys: |
            dl-${{ steps.src.outputs.sha }}-

      - name: 更新 feeds 并按 lock 锁定
        run: |
          set -euo pipefail
          cd openwrt
          mkdir -p ../out
          ./scripts/feeds update -a
          while read -r name sha || [ -n "${name:-}" ]; do
            [ -n "$name" ] || continue
            [ "$name" = "${name#\#}" ] || continue
            [ -d "feeds/$name/.git" ] || { echo "feeds/$name 不存在" >&2; exit 1; }
            git -C "feeds/$name" fetch --depth 1 origin "$sha"
            git -C "feeds/$name" checkout --detach FETCH_HEAD
            actual=$(git -C "feeds/$name" rev-parse HEAD)
            [ "$actual" = "$sha" ] || { echo "feed $name 锁定失败: $actual != $sha" >&2; exit 1; }
          done < ../config/feeds.lock
          ./scripts/feeds install -a
          : > ../out/feeds.lock
          for d in feeds/*; do
            [ -d "$d/.git" ] || continue
            printf '%s %s\n' "$(basename "$d")" "$(git -C "$d" rev-parse HEAD)" >> ../out/feeds.lock
          done
          cat ../out/feeds.lock

      # 固件脚本是仓库里的文件，不再塞在 YAML heredoc 里：
      # PR 可以 sh -n 校验，也不会再漏掉 "enable" 这类一行改动。
      - name: 注入默认配置、构建信息和首启保护
        env:
          HARDENING: ${{ inputs.hardening }}
        run: |
          set -euo pipefail
          DEST=openwrt/package/base-files/files
          mkdir -p "$DEST"
          cp -a files/. "$DEST"/
          chmod 0755 "$DEST"/etc/uci-defaults/99-ax6000-defaults \
                     "$DEST"/etc/init.d/ledinterval \
                     "$DEST"/etc/init.d/ax6000-firstboot-guard \
                     "$DEST"/etc/init.d/ax6000-perf

          SHA='${{ steps.src.outputs.sha }}'
          : "${SOURCE_DATE_EPOCH:?SOURCE_DATE_EPOCH 未由上游步骤写入}"
          BUILD_DATE="$(date -u -d "@${SOURCE_DATE_EPOCH}" +%FT%TZ)"
          {
            echo "UPSTREAM_REPO=${SOURCE_REPO}"
            echo "UPSTREAM_SHA=${SHA}"
            echo "REPO_SHA=${GITHUB_SHA}"
            echo "CONFIG_SHA256=$(sha256sum config/ax6000.config | cut -d' ' -f1)"
            echo "FEEDS_LOCK_SHA256=$(sha256sum out/feeds.lock | cut -d' ' -f1)"
            echo "UPSTREAM_MODE=${UPSTREAM_MODE:-latest}"
            echo "HARDENING=${HARDENING:-on}"
            echo "BUILD_DATE=${BUILD_DATE}"
          } > "$DEST"/etc/ax6000-build-info

          for f in etc/uci-defaults/99-ax6000-defaults \
                   etc/init.d/ledinterval \
                   etc/init.d/ax6000-firstboot-guard \
                   etc/init.d/ax6000-perf; do
            cmp -s "files/$f" "$DEST/$f" || { echo "注入文件不一致: $f" >&2; exit 1; }
          done
          echo "--- build info ---"
          cat "$DEST"/etc/ax6000-build-info

      - name: 应用并校验配置
        env:
          HARDENING: ${{ inputs.hardening }}
        run: |
          set -euo pipefail
          cp config/ax6000.config openwrt/.config
          if [ "${HARDENING:-on}" = "off" ]; then
            echo "::warning::hardening=off：临时关闭 CHECK_FORMAT_SECURITY / RELRO_FULL / CCACHE，仅用于定位失败，产物不要发布"
            sed -i \
              -e 's/^CONFIG_PKG_CHECK_FORMAT_SECURITY=y/# CONFIG_PKG_CHECK_FORMAT_SECURITY is not set/' \
              -e 's/^CONFIG_PKG_RELRO_FULL=y/# CONFIG_PKG_RELRO_FULL is not set/' \
              -e 's/^CONFIG_CCACHE=y/# CONFIG_CCACHE is not set/' \
              openwrt/.config
          fi
          cd openwrt
          make defconfig
          cd ..
          sh scripts/validate-config.sh openwrt/.config

          # run #10 的失败点：kmod-nft-compat 依赖 kmod-nf-ipt，后者要求 ip_tables.ko，
          # 而上游内核配置没编它；错误到编译末期才报。这里 defconfig 后立刻拦住。
          for bad in kmod-nft-compat kmod-nf-ipt; do
            if grep -q "^CONFIG_PACKAGE_${bad}=y" openwrt/.config; then
              echo "::error::${bad} 被选中，会要求 ip_tables.ko 而内核没编它"; exit 1
            fi
          done
          echo "已确认不再引入 kmod-nf-ipt"

          echo "--- 目标机型 ---"
          grep -E '^CONFIG_TARGET_DEVICE_.*=y' openwrt/.config

          # 只比对仓库里显式声明的键；全量 diff 每次都会因为 defconfig 补默认值而刷屏。
          echo "--- 显式配置项与 defconfig 的差异（仅警告）---"
          awk -F= '/^CONFIG_/{print $1}' config/ax6000.config | sort -u > /tmp/config.keys
          while IFS= read -r key; do
            want="$(grep -m1 "^${key}=" config/ax6000.config | cut -d= -f2-)"
            got="$(grep -m1 "^${key}=" openwrt/.config | cut -d= -f2-)" || got='<缺失>'
            if [ "$want" != "$got" ]; then
              echo "::warning::${key}: 仓库=${want} defconfig=${got}"
            fi
          done < /tmp/config.keys
          echo "配置校验通过"

      - name: 预下载源码
        timeout-minutes: 45
        run: |
          set -euo pipefail
          cd openwrt
          make -j"$(nproc)" download || make -j"$(nproc)" download || make -j1 download

      - name: 编译
        timeout-minutes: 335
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          set -o pipefail
          cd openwrt
          J="${JOBS:-$(nproc)}"
          case "$J" in
            ''|*[!0-9]*) echo "jobs 必须是 1-64 的正整数，当前: $J" >&2; exit 1 ;;
          esac
          [ "$J" -ge 1 ] && [ "$J" -le 64 ] || { echo "jobs 超出范围: $J" >&2; exit 1; }
          echo "并行数: $J"
          if ! make -j"$J" 2>&1 | tee build.log; then
            echo "--- 编译错误摘要 ---"
            grep -iE 'error:|Error [0-9]+|No rule to make|Killed|fatal error|undefined reference|cannot find|signal terminated|failed' build.log \
              | tail -80 || true
            echo "--- build.log 尾部 200 行 ---"
            tail -200 build.log || true
            # 3d34af8 以「全量 -j1 重试做不完」为由删掉了重试，但 OpenWrt 的 make 是
            # 增量构建：-j1 V=s 只会继续未完成的包，不会从头重编。并行竞态 / OOM 类
            # 失败靠这一步救回；真正的编译错误也会因 V=s 在这里给出完整命令行。
            # 原仓库 714b898 的构建成功过，它带的正是这个 -j1 重试。
            echo "--- 增量 -j1 V=s 重试（只继续未完成的包）---"
            make -j1 V=s 2>&1 | tee -a build.log
          fi

      - name: 收集固件和元数据
        env:
          SHA: ${{ steps.src.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp openwrt/bin/targets/mediatek/filogic/*ax6000-mtkuboot* out/
          cp openwrt/bin/targets/mediatek/filogic/*.manifest out/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/filogic/config.buildinfo out/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/filogic/profiles.json out/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/filogic/sha256sums out/ 2>/dev/null || true
          cd out
          BUILD_DATE="$(date -u -d "@${SOURCE_DATE_EPOCH}" +%FT%TZ)"
          {
            echo "UPSTREAM_REPO=${SOURCE_REPO}"
            echo "UPSTREAM_SHA=${SHA}"
            echo "REPO_SHA=${GITHUB_SHA}"
            echo "CONFIG_SHA256=$(sha256sum ../config/ax6000.config | cut -d' ' -f1)"
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "FEEDS_LOCK_SHA256=$(sha256sum feeds.lock | cut -d' ' -f1)"
            echo "UPSTREAM_MODE=${UPSTREAM_MODE:-latest}"
            echo "HARDENING=${{ inputs.hardening || 'on' }}"
            echo "KERNEL=$(grep -m1 '^CONFIG_KERNEL_VERSION=' ../openwrt/.config || true)"
            echo "WIFI_DRIVER=$(grep -m1 '^CONFIG_MTK_MT_WIFI_DRIVER_VERSION_' ../openwrt/.config || true)"
            echo "WIFI_FIRMWARE=$(grep -m1 '^CONFIG_MTK_MT_WIFI_FIRMWARE_PATH_MT7986=' ../openwrt/.config || true)"
            echo "IMAGES:"
            ls -1 ./*.bin
          } > BUILD_INFO.txt
          # 排除清单自身：重跑 / 复用 out 时不会把旧清单算进去导致校验失败。
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -lh

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-mtkuboot-${{ steps.src.outputs.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.src.outputs.sha }}
          path: openwrt/build.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: 下载固件产物
        uses: actions/download-artifact@v4
        with:
          name: ax6000-mtkuboot-${{ needs.build.outputs.sha }}
          path: out

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          {
            echo "## 变更"
            echo "- 上游: ${SOURCE_REPO}@${SHA}"
            echo "- 本仓库: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            echo "- 配置 SHA256: $(grep '^CONFIG_SHA256=' out/BUILD_INFO.txt | cut -d= -f2)"
            echo "- 构建时间: $(grep '^BUILD_DATE=' out/BUILD_INFO.txt | cut -d= -f2-)"
            echo "- 触发方式: ${GITHUB_EVENT_NAME}"
            echo "- 运行记录: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "## 校验"
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo ""
            echo "## 刷机"
            echo "见 README 的刷机/救砖章节；普通 sysupgrade 保留 /etc/config。"
          } > release-notes.md
          cat release-notes.md
          # 这个 job 没有 checkout，必须显式指定仓库，否则 gh 无法推断 base repo。
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，覆盖同一 commit 的产物"
            gh release upload "$TAG" out/* --clobber --repo "$GH_REPO"
            gh release edit "$TAG" --notes-file release-notes.md --repo "$GH_REPO"
          else
            gh release create "$TAG" out/* \
              --target "${GITHUB_SHA}" \
              --title "AX6000 ${TAG}" \
              --notes-file release-notes.md \
              --repo "$GH_REPO"
          fi
