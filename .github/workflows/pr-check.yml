name: PR config check

on:
  pull_request:
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装最小依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git libncurses-dev libssl-dev \
            python3 python3-distutils python3-setuptools bc patch rsync unzip \
            zlib1g-dev file wget curl

      - name: 拉取钉死的上游
        env:
          SOURCE_REPO: chasey-dev/immortalwrt-mt798x-rebase
          UPSTREAM_SHA: 9f397975c7b47ce6986a6e39529d2f72fd5c729d
        run: |
          set -euo pipefail
          git init openwrt
          cd openwrt
          git remote add origin "https://github.com/${SOURCE_REPO}.git"
          git fetch --depth 1 origin "$UPSTREAM_SHA"
          git checkout --detach FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$UPSTREAM_SHA" ]

      - name: 更新 feeds 并按 lock 锁定
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a
          if [ -f ../config/feeds.lock ]; then
            while read -r name sha; do
              [ -n "$name" ] || continue
              [ "$name" = "${name#\#}" ] || continue
              git -C "feeds/$name" fetch --depth 1 origin "$sha"
              git -C "feeds/$name" checkout --detach FETCH_HEAD
            done < ../config/feeds.lock
          fi
          ./scripts/feeds install -a

      - name: 生成 defconfig 并断言
        run: |
          set -euo pipefail
          cp config/ax6000.config openwrt/.config
          cd openwrt
          make defconfig
          cd ..
          sh scripts/validate-config.sh openwrt/.config

      - name: 检查脚本语法
        run: |
          set -euo pipefail
          sh -n scripts/validate-config.sh
