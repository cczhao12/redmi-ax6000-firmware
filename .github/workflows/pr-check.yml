name: PR config check

on:
  pull_request:
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'files/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'files/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 秒级失败：固件脚本语法、包清单格式、feeds.lock，不用等 make defconfig。
      - name: 静态校验仓库文件
        run: sh scripts/validate-config.sh

      - name: 安装最小依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git libncurses-dev libssl-dev \
            python3 python3-distutils python3-setuptools bc patch rsync unzip \
            zlib1g-dev file wget curl

      - name: 拉取上游 25.12 最新 HEAD（与 build 默认一致）
        env:
          SOURCE_REPO: chasey-dev/immortalwrt-mt798x-rebase
          UPSTREAM_BRANCH: '25.12'
        run: |
          set -euo pipefail
          SHA=$(git ls-remote "https://github.com/${SOURCE_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | awk '{print $1}')
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "无法解析上游 ${UPSTREAM_BRANCH} HEAD" >&2; exit 1; }
          git init openwrt
          cd openwrt
          git remote add origin "https://github.com/${SOURCE_REPO}.git"
          git fetch --depth 1 origin "$SHA"
          git checkout --detach FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$SHA" ]
          echo "PR 校验基于上游 ${SHA}"

      - name: 更新 feeds 并按 lock 锁定
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a
          while read -r name sha || [ -n "${name:-}" ]; do
            [ -n "$name" ] || continue
            [ "$name" = "${name#\#}" ] || continue
            [ -d "feeds/$name/.git" ] || { echo "feeds/$name 不存在" >&2; exit 1; }
            git -C "feeds/$name" fetch --depth 1 origin "$sha"
            git -C "feeds/$name" checkout --detach FETCH_HEAD
            actual=$(git -C "feeds/$name" rev-parse HEAD)
            [ "$actual" = "$sha" ] || { echo "feed $name 锁定失败: $actual != $sha" >&2; exit 1; }
          done < ../config/feeds.lock
          ./scripts/feeds install -a

      - name: 生成 defconfig 并断言
        run: |
          set -euo pipefail
          cp config/ax6000.config openwrt/.config
          cd openwrt
          make defconfig
          cd ..
          sh scripts/validate-config.sh openwrt/.config
