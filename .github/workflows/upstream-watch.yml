name: Upstream health check

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      # 需要读 config/upstream.lock，所以必须先 checkout。
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 对比 fork 分支与 upstream.lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REPO: cczhao12/immortalwrt-mt798x-rebase
          UPSTREAM_BRANCH: '25.12'
          UPSTREAM_LOCK_FILE: config/upstream.lock
        run: |
          set -euo pipefail
          PIN=$(grep -Ev '^[[:space:]]*(#|$)' "$UPSTREAM_LOCK_FILE" | head -1 | awk '{print $1}')
          printf '%s' "$PIN" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::$UPSTREAM_LOCK_FILE 里没有合法 40 位 SHA" >&2; exit 1; }

          NEW=$(git ls-remote "https://github.com/${SOURCE_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | awk '{print $1}')
          if ! printf '%s' "$NEW" | grep -Eq '^[0-9a-f]{40}$'; then
            TITLE="上游 fork 的 ${UPSTREAM_BRANCH} 分支不可达"
            cat > /tmp/body.md <<EOF
          fork: https://github.com/${SOURCE_REPO}
          分支: \`${UPSTREAM_BRANCH}\`
          \`git ls-remote\` 没有拿到 40 位 commit SHA。

          影响:
          - 默认构建（upstream_ref=pinned）读的是 config/upstream.lock 的 \`${PIN}\`，
            只要那个 commit 还在这份 fork 里，构建不受影响。
          - 需要检查 fork 是否被删/改名，或网络异常。
          EOF
          else
            echo "fork ${UPSTREAM_BRANCH}: ${NEW}"
            echo "upstream.lock:    ${PIN}"
            if [ "$NEW" = "$PIN" ]; then
              echo "一致，无需处理。"
              exit 0
            fi
            TITLE="上游 fork 已前进：${NEW:0:7}（lock 仍是 ${PIN:0:7}）"
            cat > /tmp/body.md <<EOF
          fork 的 \`${UPSTREAM_BRANCH}\` 从钉死的 \`${PIN}\` 变成了 \`${NEW}\`。

          影响:
          - **默认构建不受影响**：它读 config/upstream.lock，仍是 \`${PIN}\`。
          - 这只是一个“可以升级了”的信号。

          升级步骤:
          1. workflow_dispatch 用 \`upstream_ref=${NEW}\` 做测试构建（只产 artifact、不发 Release）
          2. 完整编译成功、上机正常后，把 config/upstream.lock 改成 \`${NEW}\`
          3. 同步检查 config/feeds.lock 与 config/ax6000.config
          EOF
          fi

          # 这个 job 用 gh 操作 issue；--state all 避免重复开 issue。
          EXISTING=$(gh issue list --repo "$GH_REPO" --state all --search "$TITLE" \
            --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body-file /tmp/body.md
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file /tmp/body.md
          fi
