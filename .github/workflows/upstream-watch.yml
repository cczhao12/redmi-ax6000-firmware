name: Upstream health check

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: 检查上游 25.12 是否可达
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REPO: chasey-dev/immortalwrt-mt798x-rebase
          UPSTREAM_BRANCH: '25.12'
        run: |
          set -euo pipefail
          NEW=$(git ls-remote "https://github.com/${SOURCE_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | awk '{print $1}')
          if printf '%s' "$NEW" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "上游 ${UPSTREAM_BRANCH} 最新: $NEW"
            echo "默认构建使用钉死的 9f397975...，不受本检查影响；这里只做上游健康提示。"
            exit 0
          fi

          TITLE="上游 ${UPSTREAM_BRANCH} 分支不可达"
          cat > /tmp/upstream-body.md <<EOF
          上游仓库: https://github.com/${SOURCE_REPO}
          分支: \`${UPSTREAM_BRANCH}\`
          \`git ls-remote\` 没有拿到 40 位 commit SHA。

          影响:
          - 仅作上游健康提示；默认构建用钉死的 9f397975...，不受影响。
          - 如需升级上游，先用 workflow_dispatch 的 source_ref 做测试构建，
            完整编译成功后再改 build-ax6000.yml 的 UPSTREAM_SHA 与 config/feeds.lock。
          EOF

          # 这个 job 没有 checkout，gh 必须显式指定仓库；--state all 避免重复开 issue。
          EXISTING=$(gh issue list --repo "$GH_REPO" --state all --search "$TITLE" \
            --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body-file /tmp/upstream-body.md
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file /tmp/upstream-body.md
          fi
